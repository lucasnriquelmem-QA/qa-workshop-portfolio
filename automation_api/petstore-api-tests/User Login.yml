info:
  name: User Login
  type: http
  seq: 1

http:
  method: POST
  url: https://petstore.octoperf.com/actions/Account.action
  body:
    type: form-urlencoded
    data:
      - name: username
        value: j2ee
      - name: password
        value: j2ee
      - name: signon
        value: Login
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
